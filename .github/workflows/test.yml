name: Run Tests on Pull Request

on:
  workflow_call:
    outputs:
      error_log:
        description: "El log de errores"
        value: ${{ jobs.test.outputs.log_output }}

jobs:
  test:
    name: Run Unit and Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    environment: PROD
    outputs:
      log_output: ${{ steps.error_log.outputs.log_content }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Checkout properties
        uses: actions/checkout@v4
        with:
          repository: nano871022/japl-properties
          path: ./properties
          ref: main
          token: ${{ secrets.PROPERTIES_TOKEN }}

      - name: Copy Keystore
        run: |
          mkdir -p app
          cp properties/ride-connect/google-services.json app/google-services.json    
          echo api.key.map=${{ secrets.API_KEY_MAP }} > local.properties

      - name: Checkout japl about module
        uses: actions/checkout@v4
        with:
          repository: nano871022/japl-android-about-module
          path: about

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        id: run_tests
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew test -x :about:test | tee build_errors.log

      - name: Package test and lint results as zip
        if: always()
        run: |
          mkdir -p zipped_artifacts
          zip -r zipped_artifacts/test-results.zip **/build/reports/tests/ || true

      - name: Upload test results zip artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-zip
          path: zipped_artifacts/test-results.zip

      - name: Generate Job Summary & Check Warnings/Errors
        id: analyze_results
        if: always()
        run: |
          echo "## 📊 Test Execution Summary" >> $GITHUB_STEP_SUMMARY

          TEST_STATUS="${{ steps.run_tests.outcome }}"
          echo "**Build Status:** $TEST_STATUS" >> $GITHUB_STEP_SUMMARY

          WARNINGS_FOUND=false
          ERRORS_FOUND=false

          if [ "$TEST_STATUS" != "success" ]; then
            ERRORS_FOUND=true
            echo "### ❌ Failures Detected" >> $GITHUB_STEP_SUMMARY
            echo "Unit tests or lint analysis failed during execution." >> $GITHUB_STEP_SUMMARY
          fi

          echo "WARNINGS_FOUND=$WARNINGS_FOUND" >> $GITHUB_OUTPUT
          echo "ERRORS_FOUND=$ERRORS_FOUND" >> $GITHUB_OUTPUT

      - name: Read Error Log
        if: always()
        id: error_log
        run: |
          if [ -f build_errors.log ]; then
            ERROR_CONTENT=$(tail -n 50 build_errors.log)
          else
            ERROR_CONTENT="No build_errors.log file found."
          fi
          echo "log_content<<EOF" >> $GITHUB_OUTPUT
          echo "$ERROR_CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Fail workflow if test step failed
        if: steps.run_tests.outcome != 'success'
        run: exit 1
