name: Run Tests on Pull Request

on:
  workflow_call:

jobs:
  test:
    name: Run Unit and Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    environment: PROD

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Checkout properties
        uses: actions/checkout@v4
        with:
          repository: nano871022/japl-properties
          path: ./properties
          ref: main
          token: ${{ secrets.PROPERTIES_TOKEN }}

      - name: Copy Keystore
        run: |
          mkdir -p app
          cp properties/ride-connect/google-services.json app/google-services.json    

      - name: Checkout japl about module
        uses: actions/checkout@v4
        with:
          repository: nano871022/japl-android-about-module
          path: about

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        id: run_tests
        continue-on-error: true
        run: ./gradlew test -x :about:test

      - name: Package test and lint results as zip
        if: always()
        run: |
          mkdir -p zipped_artifacts
          zip -r zipped_artifacts/test-results.zip **/build/reports/tests/ || true

      - name: Upload test results zip artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-zip
          path: zipped_artifacts/test-results.zip

      - name: Generate Job Summary & Check Warnings/Errors
        id: analyze_results
        if: always()
        run: |
          echo "## 📊 Test Execution Summary" >> $GITHUB_STEP_SUMMARY

          TEST_STATUS="${{ steps.run_tests.outcome }}"
          echo "**Build Status:** $TEST_STATUS" >> $GITHUB_STEP_SUMMARY

          WARNINGS_FOUND=false
          ERRORS_FOUND=false

          if [ "$TEST_STATUS" != "success" ]; then
            ERRORS_FOUND=true
            echo "### ❌ Failures Detected" >> $GITHUB_STEP_SUMMARY
            echo "Unit tests or lint analysis failed during execution." >> $GITHUB_STEP_SUMMARY
          fi

          echo "WARNINGS_FOUND=$WARNINGS_FOUND" >> $GITHUB_OUTPUT
          echo "ERRORS_FOUND=$ERRORS_FOUND" >> $GITHUB_OUTPUT

      - name: Automatically Create Issue on Errors or Warnings
        if: always() && (steps.analyze_results.outputs.ERRORS_FOUND == 'true' || steps.analyze_results.outputs.WARNINGS_FOUND == 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_TITLE="[CI Alert] Test Errors or Warnings in Commit ${{ github.sha }}"
          ISSUE_BODY="Automated issue created by GitHub Actions.

          **Workflow:** ${{ github.workflow }}
          **Run Number:** ${{ github.run_number }}
          **Commit:** ${{ github.sha }}
          **Branch/Ref:** ${{ github.ref }}

          ### Status
          - **Test Execution Status:** ${{ steps.run_tests.outcome }}

          Please check the workflow artifacts (\`test-results-zip\`, \`lint-results-zip\`) and job summary for detailed test and lint outputs."

          gh issue create --title "$ISSUE_TITLE" --body "$ISSUE_BODY" --label "bug" || echo "Failed to create issue or gh CLI not authenticated."

      - name: Fail workflow if test step failed
        if: steps.run_tests.outcome != 'success'
        run: exit 1
