name: Update Project Version

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  update-version:
    name: Bump Version, Update Changelog & Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Calculate New Version
        id: versioning
        run: |
          BUILD_FILE="app/build.gradle.kts"
          CURRENT_VERSION_NAME=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' $BUILD_FILE | tr -d ' ')
          CURRENT_VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' $BUILD_FILE | tr -d ' ')

          if [ -z "$CURRENT_VERSION_NAME" ]; then
            CURRENT_VERSION_NAME="1.0.0"
          fi
          if [ -z "$CURRENT_VERSION_CODE" ]; then
            CURRENT_VERSION_CODE=1
          fi

          NEW_VERSION_CODE=$((CURRENT_VERSION_CODE + 1))

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION_NAME"
          MAJOR=${MAJOR:-1}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          BUMP_TYPE="${{ github.event.inputs.version_type }}"

          if [ "$BUMP_TYPE" = "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$BUMP_TYPE" = "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}"

          echo "NEW_VERSION_NAME=$NEW_VERSION_NAME" >> $GITHUB_ENV
          echo "NEW_VERSION_CODE=$NEW_VERSION_CODE" >> $GITHUB_ENV
          echo "Calculated version: $NEW_VERSION_NAME ($NEW_VERSION_CODE)"

      - name: Update app/build.gradle.kts
        run: |
          BUILD_FILE="app/build.gradle.kts"
          sed -i "s/versionCode = [0-9]*/versionCode = $NEW_VERSION_CODE/" $BUILD_FILE
          sed -i "s/versionName = \".*\"/versionName = \"$NEW_VERSION_NAME\"/" $BUILD_FILE

      - name: Generate Changelog Recap
        id: changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --oneline -n 20)
          else
            COMMITS=$(git log ${LAST_TAG}..HEAD --oneline)
          fi

          DATE=$(date +'%Y-%m-%d')
          CHANGELOG_FILE="CHANGELOG.md"

          ENTRY="## [$NEW_VERSION_NAME] - $DATE\n\n### Summary of Changes\n$COMMITS\n\n"

          if [ -f "$CHANGELOG_FILE" ]; then
            TEMP_FILE=$(mktemp)
            echo -e "$ENTRY" > "$TEMP_FILE"
            cat "$CHANGELOG_FILE" >> "$TEMP_FILE"
            mv "$TEMP_FILE" "$CHANGELOG_FILE"
          else
            echo -e "# Changelog\n\n$ENTRY" > "$CHANGELOG_FILE"
          fi

      - name: Commit, Tag, and Push
        run: |
          TAG_NAME="v$NEW_VERSION_NAME"
          git add app/build.gradle.kts CHANGELOG.md
          git commit -m "chore(release): bump version to $TAG_NAME [skip ci]"
          git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
          git push origin master --tags
