name: Compile Application Bundle

on:
  push:
    branches:
      - master

jobs:
  compile:
    name: Build Android App Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Download Keystore
        run: |
          mkdir -p app
          curl -sL https://raw.githubusercontent.com/nano871022/japl-properties/main/ride-connect/ride-connect-sha.jks -o app/ride-connect-sha.jks

      - name: Build Android App Bundle (.aab) and APK (.apk)
        env:
          KEYSTORE_FILE: app/ride-connect-sha.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEY_PASS_JKS_FIRM_ANDROID_BUNDLE }}
          KEY_ALIAS: ride-connect
          KEY_PASSWORD: ${{ secrets.KEY_PASS_JKS_FIRM_ANDROID_BUNDLE }}
          TUYA_APP_KEY: ${{ secrets.TUYA_DEV_APP_KEY }}
          TUYA_APP_SECRET: ${{ secrets.TUYA_DEV_APP_SECRET }}
          TUYA_DEV_APP_KEY: ${{ secrets.TUYA_DEV_APP_KEY }}
          TUYA_DEV_APP_SECRET: ${{ secrets.TUYA_DEV_APP_SECRET }}
        run: ./gradlew bundleRelease assembleRelease

      - name: Upload Android App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: app/build/outputs/bundle/release/*.aab

      - name: Upload Android App APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
